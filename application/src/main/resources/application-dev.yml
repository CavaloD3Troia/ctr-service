# Local development. The defaults point at `docker compose up -d`, so the app runs from the IDE as is.
# The container (`make up`) overrides them through the environment variables in docker-compose.yml.
spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ctr}
    username: ${DB_USERNAME:ctr}
    password: ${DB_PASSWORD:ctr}
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
