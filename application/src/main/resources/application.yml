# Shared by every profile. Where Postgres and the clips' bucket are is per profile: run with `dev`, `test` or `prod`
# (SPRING_PROFILES_ACTIVE or --spring.profiles.active). Without one the app has no database and does not start.
spring:
  application:
    name: ctr-service
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.cavalodetroia.ctr.infra.kafka.serialization.ProtobufSerializer

# One JSON object per line, with the MDC (correlation_id, session_id, camera…) as top-level fields
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
