# Defaults point at the dependencies started by `docker compose up -d`, so the app runs from the IDE as is.
# The container (`make up`) overrides them through the environment variables in docker-compose.yml.
spring:
  application:
    name: ctr-service
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/ctr}
    username: ${DB_USERNAME:ctr}
    password: ${DB_PASSWORD:ctr}
  liquibase:
    change-log: classpath:db/changelog/db.changelog-master.yaml
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      value-serializer: org.cavalodetroia.ctr.infra.kafka.serialization.ProtobufSerializer

ctr:
  # Where cameras upload their clips, and how ctr-service reaches it to check them (StorageProperties). The defaults
  # are the MinIO of docker-compose.yml; on AWS set S3_ENDPOINT to an empty value and real credentials
  storage:
    bucket: ${CTR_STORAGE_BUCKET:cdt-videos}
    endpoint: ${S3_ENDPOINT:http://localhost:9000}
    region: ${S3_REGION:us-east-1}
    access-key: ${S3_ACCESS_KEY:minioadmin}
    secret-key: ${S3_SECRET_KEY:minioadmin}

# One JSON object per line, with the MDC (correlation_id, session_id, camera…) as top-level fields
logging:
  structured:
    format:
      console: logstash
    json:
      add:
        service: ${spring.application.name}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
