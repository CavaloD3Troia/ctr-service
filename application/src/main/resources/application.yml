# Shared by every profile. Where to find Postgres and Kafka is per profile: run with `dev`, `test` or `prod`
# (SPRING_PROFILES_ACTIVE or --spring.profiles.active). Without one the app has no database and does not start.
spring:
  application:
    name: ctr-service
  kafka:
    producer:
      value-serializer: org.cavalodetroia.ctr.infra.kafka.ProtobufSerializer
    consumer:
      group-id: ctr-service
      auto-offset-reset: earliest
      # A message that cannot be parsed is logged and skipped instead of blocking the partition
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.cavalodetroia.ctr.infra.kafka.EventCreatedDeserializer
  mvc:
    problemdetails:
      enabled: true

# Bound to CtrKafkaProperties
ctr:
  kafka:
    topic: ctr.event.created.v1

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true
