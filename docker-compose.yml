# `docker compose up -d`                → Postgres, Kafka and MinIO only (run/debug the app from the IDE)
# `docker compose --profile app up -d`  → the app too (see `make up`)
name: ctr-service

services:
  postgres:
    image: postgres:18.6-alpine
    environment:
      POSTGRES_DB: ctr
      POSTGRES_USER: ctr
      POSTGRES_PASSWORD: ctr
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctr -d ctr"]
      interval: 5s
      timeout: 3s
      retries: 10

  kafka:
    image: apache/kafka:4.3.2
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      # HOST is what the app sees when it runs on your machine, DOCKER when it runs in this compose network
      KAFKA_LISTENERS: HOST://:9092,DOCKER://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: HOST://localhost:9092,DOCKER://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: HOST:PLAINTEXT,DOCKER:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: DOCKER
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_NUM_PARTITIONS: 3
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 > /dev/null 2>&1"]
      interval: 5s
      timeout: 10s
      retries: 20
      start_period: 10s

  # S3-compatible object storage (DEC-0007). MinIO no longer publishes images to Docker Hub or quay.io, so this is
  # Chainguard's build of it (RELEASE.2026-10-23T20-06-51Z), pinned by digest because only `latest` is free.
  # S3 API on :9000, web console on :9001 (log in with the root user below).
  minio:
    image: chainguard/minio:latest@sha256:3b6e40c30ecd5cea627e382ff0b82ca841f58c52294578787043ee80c8ef7c82
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      # Local only, like the Postgres credentials above
      MINIO_ROOT_USER: ctr
      MINIO_ROOT_PASSWORD: ctr-local
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 3s
      retries: 10

  ctr-service:
    profiles: [app]
    build: .
    image: ctr-service:local
    depends_on:
      postgres:
        condition: service_healthy
      kafka:
        condition: service_healthy
    environment:
      SPRING_PROFILES_ACTIVE: dev
      DB_URL: jdbc:postgresql://postgres:5432/ctr
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports:
      - "8080:8080"
    healthcheck:
      # The JRE image has no curl, so bash asks the readiness endpoint directly
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/8080 && printf 'GET /actuator/health/readiness HTTP/1.0\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 10s

volumes:
  postgres-data:
  minio-data:
